<div style="max-width:700px;margin:0 auto;">
  <svg id="cog-scale-svg" viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:Arial, Helvetica, sans-serif;">
    <!-- baseline -->
    <line x1="60" y1="380" x2="660" y2="380" stroke="#ccc" stroke-width="2"/>

    <!-- C-60 Cassette bar (red) -->
    <rect x="120" y="40" width="90" height="340" fill="#c62828"/>
    <text x="165" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">C-60 Cassette</text>
    <text x="165" y="405" text-anchor="middle" font-size="13" fill="#444">1977</text>
    <text x="165" y="422" text-anchor="middle" font-size="13" fill="#444">5,682 tapes</text>
    <text x="165" y="439" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">~237 ft stack</text>

    <!-- DS/DD Floppy bar (amber) -->
    <rect x="310" y="115" width="90" height="265" fill="#f9a825"/>
    <text x="355" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">DS/DD Floppy</text>
    <text x="355" y="405" text-anchor="middle" font-size="13" fill="#444">1982</text>
    <text x="355" y="422" text-anchor="middle" font-size="13" fill="#444">2,777 disks</text>
    <text x="355" y="439" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9a825">~30 ft stack</text>

    <!-- microSD bar (green, log-scale sliver) -->
    <rect x="500" y="360" width="90" height="20" fill="#2e7d32"/>
    <text x="545" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">microSD</text>
    <text x="545" y="405" text-anchor="middle" font-size="13" fill="#444">2025+</text>
    <text x="545" y="422" text-anchor="middle" font-size="13" fill="#444">1 card</text>
    <text x="545" y="439" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">size of a fingernail</text>
  </svg>
  <p style="font-size:0.8rem;color:#666;text-align:center;margin-top:4px;">
    Bar heights are log-scaled for visibility, not literal &mdash; a true-scale microSD bar would be a fraction of a pixel next to the cassette tower.
    Each stack holds 1 gigabyte in that format's media.
  </p>
</div>
