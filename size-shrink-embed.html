<div style="max-width:1200px;margin:0 auto;">
  <svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:Arial, Helvetica, sans-serif;">
    <defs>
      <linearGradient id="cogShrinkBg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#14161a"/>
        <stop offset="100%" stop-color="#22262c"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="1200" height="470" fill="url(#cogShrinkBg)"/>
    <rect x="0" y="0" width="1200" height="6" fill="#f7941d"/>

    <text x="600" y="62" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="1.5">ONE GIGABYTE, THEN AND NOW</text>
    <rect x="510" y="80" width="180" height="4" fill="#f7941d"/>
    <text x="600" y="112" text-anchor="middle" font-size="18" fill="#c7c7c7">The physical space it took to store 1 gigabyte — same unit, 49 years apart</text>

    <line x1="120" y1="215" x2="1080" y2="215" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- C-60 Cassette 1977 -->
    <g transform="translate(175,215) scale(1.35)">
      <rect x="-28" y="-18" width="56" height="36" rx="4" fill="none" stroke="#f7941d" stroke-width="2.5"/>
      <circle cx="-12" cy="0" r="7" fill="none" stroke="#f7941d" stroke-width="2"/>
      <circle cx="12" cy="0" r="7" fill="none" stroke="#f7941d" stroke-width="2"/>
    </g>
    <text x="175" y="258" text-anchor="middle" font-size="14" fill="#9a9ea5">1977 · Cassette</text>
    <text x="175" y="288" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">72,238 mm</text>
    <text x="175" y="308" text-anchor="middle" font-size="12" fill="#9a9ea5">237 ft · ~20-story building</text>

    <!-- DS/DD Floppy 1982 -->
    <g transform="translate(458,215) scale(1.1)">
      <rect x="-24" y="-24" width="48" height="48" rx="2" fill="none" stroke="#f7941d" stroke-width="2.5"/>
      <rect x="-10" y="-24" width="20" height="14" fill="#f7941d"/>
      <rect x="-16" y="4" width="32" height="14" fill="none" stroke="#f7941d" stroke-width="2"/>
    </g>
    <text x="458" y="258" text-anchor="middle" font-size="14" fill="#9a9ea5">1982 · DS/DD Floppy</text>
    <text x="458" y="288" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">9,144 mm</text>
    <text x="458" y="308" text-anchor="middle" font-size="12" fill="#9a9ea5">30 ft · ~3-story building</text>

    <!-- microSD 2025 -->
    <g transform="translate(741,215) scale(0.85)">
      <path d="M -16 -22 L 10 -22 L 18 -14 L 18 22 L -16 22 Z" fill="none" stroke="#f7941d" stroke-width="2.5"/>
    </g>
    <text x="741" y="258" text-anchor="middle" font-size="14" fill="#9a9ea5">2025 · microSD</text>
    <text x="741" y="288" text-anchor="middle" font-size="25" font-weight="800" fill="#f7941d">0.0005 mm</text>
    <text x="741" y="308" text-anchor="middle" font-size="12" fill="#9a9ea5">a wavelength of visible light</text>

    <!-- Enterprise SSD 2026 -->
    <g transform="translate(1025,215) scale(0.6)">
      <rect x="-30" y="-16" width="60" height="32" rx="3" fill="none" stroke="#f7941d" stroke-width="2.5"/>
      <rect x="-30" y="-6" width="8" height="12" fill="#f7941d"/>
    </g>
    <text x="1025" y="258" text-anchor="middle" font-size="14" fill="#9a9ea5">2026 · Enterprise SSD</text>
    <text x="1025" y="288" text-anchor="middle" font-size="25" font-weight="800" fill="#f7941d">0.0000586 mm</text>
    <text x="1025" y="308" text-anchor="middle" font-size="12" fill="#9a9ea5">roughly virus-sized</text>

    <text x="600" y="400" text-anchor="middle" font-size="52" font-weight="800" fill="#f7941d" letter-spacing="1">1.23 BILLION&#215; SMALLER</text>
    <text x="600" y="430" text-anchor="middle" font-size="16" fill="#c7c7c7">the physical space needed to store the same one gigabyte, 1977 &#8594; 2026</text>
  </svg>
  <p style="font-size:0.8rem;color:#888;text-align:center;margin-top:6px;">
    Icon sizes are stylistic, not to scale. microSD/SSD figures assume storage density is roughly uniform through the device's thickness — a simplification, not a literal cross-section measurement.
  </p>
</div>
