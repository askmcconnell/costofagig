<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161a"/>
      <stop offset="100%" stop-color="#22262c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="420" rx="16" fill="url(#pmGrad)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" letter-spacing="1">P.S. &#8212; HOW LONG TO MOVE A GIGABYTE?</text>
  <rect x="430" y="64" width="340" height="4" fill="#f7941d"/>
  <text x="600" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9aa0a6">Native media/interface speed only &#8212; not network</text>

  <!-- track -->
  <line x1="100" y1="230" x2="1100" y2="230" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- left: cassette, 1977 -->
  <g transform="translate(60,205)">
    <rect x="0" y="0" width="80" height="50" rx="6" fill="none" stroke="#f7941d" stroke-width="3"/>
    <circle cx="22" cy="25" r="10" fill="none" stroke="#f7941d" stroke-width="3"/>
    <circle cx="58" cy="25" r="10" fill="none" stroke="#f7941d" stroke-width="3"/>
  </g>
  <text x="100" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">1977</text>
  <text x="100" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa0a6">50 bytes/sec</text>

  <!-- right: lightning bolt, 2026 -->
  <g transform="translate(1075,193)">
    <path d="M27 0 L5 32 L21 32 L12 62 L48 24 L29 24 Z" fill="#f7941d"/>
  </g>
  <text x="1100" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">2026</text>
  <text x="1100" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa0a6">7,500 MB/sec</text>

  <!-- running figure, made of trailing 1s and 0s -->
  <g transform="translate(620,230)">
    <!-- binary motion trail -->
    <text x="-52" y="-18" font-family="Consolas, Menlo, monospace" font-size="20" fill="#f7941d" opacity="0.7">1</text>
    <text x="-92" y="-42" font-family="Consolas, Menlo, monospace" font-size="18" fill="#f7941d" opacity="0.55">0</text>
    <text x="-132" y="-8" font-family="Consolas, Menlo, monospace" font-size="16" fill="#f7941d" opacity="0.4">1</text>
    <text x="-172" y="-34" font-family="Consolas, Menlo, monospace" font-size="14" fill="#f7941d" opacity="0.28">0</text>
    <text x="-210" y="-14" font-family="Consolas, Menlo, monospace" font-size="12" fill="#f7941d" opacity="0.16">1</text>

    <!-- limbs -->
    <line x1="14" y1="-14" x2="46" y2="8" stroke="#f7941d" stroke-width="13" stroke-linecap="round"/>
    <line x1="46" y1="8" x2="36" y2="42" stroke="#f7941d" stroke-width="13" stroke-linecap="round"/>
    <line x1="14" y1="-14" x2="-10" y2="4" stroke="#f7941d" stroke-width="13" stroke-linecap="round"/>
    <line x1="-10" y1="4" x2="-34" y2="-10" stroke="#f7941d" stroke-width="13" stroke-linecap="round"/>
    <line x1="6" y1="-45" x2="40" y2="-60" stroke="#f7941d" stroke-width="9" stroke-linecap="round"/>
    <line x1="8" y1="-38" x2="-14" y2="-12" stroke="#f7941d" stroke-width="9" stroke-linecap="round"/>
    <line x1="0" y1="-56" x2="14" y2="-14" stroke="#f7941d" stroke-width="12" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="0" cy="-72" r="16" fill="#f7941d"/>
  </g>

  <!-- headline stat -->
  <text x="600" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#f7941d">150,000,000&#215; FASTER</text>
  <text x="600" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">A 231-day transfer, down to about 0.13 seconds</text>
</svg>
