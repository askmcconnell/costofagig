<div style="max-width:1200px;margin:0 auto;">
  <svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:Arial, Helvetica, sans-serif;">
    <title>Cost of a Gig — a 49-year, non-scientific retail history of what it costs to store one gigabyte of data.</title>
    <defs>
      <linearGradient id="cogHeroBg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#14161a"/>
        <stop offset="100%" stop-color="#22262c"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="1200" height="320" fill="url(#cogHeroBg)"/>
    <rect x="0" y="0" width="1200" height="6" fill="#f7941d"/>

    <text x="600" y="118" text-anchor="middle" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="2">COST OF A GIG</text>
    <rect x="510" y="142" width="180" height="4" fill="#f7941d"/>
    <text x="600" y="182" text-anchor="middle" font-size="21" fill="#c7c7c7">A 49-year, non-scientific retail history of what it costs</text>
    <text x="600" y="211" text-anchor="middle" font-size="21" fill="#c7c7c7">to store one gigabyte of data.</text>

    <line x1="140" y1="270" x2="1060" y2="270" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- Cassette 1977 -->
    <g transform="translate(180,250)">
      <rect x="-28" y="-18" width="56" height="36" rx="4" fill="none" stroke="#f7941d" stroke-width="2.5"/>
      <circle cx="-12" cy="0" r="7" fill="none" stroke="#f7941d" stroke-width="2"/>
      <circle cx="12" cy="0" r="7" fill="none" stroke="#f7941d" stroke-width="2"/>
      <text x="0" y="47" text-anchor="middle" font-size="14" fill="#9a9ea5">1977</text>
    </g>

    <!-- Floppy 1982 -->
    <g transform="translate(400,250)">
      <rect x="-24" y="-24" width="48" height="48" rx="2" fill="none" stroke="#f7941d" stroke-width="2.5"/>
      <rect x="-10" y="-24" width="20" height="14" fill="#f7941d"/>
      <rect x="-16" y="4" width="32" height="14" fill="none" stroke="#f7941d" stroke-width="2"/>
      <text x="0" y="47" text-anchor="middle" font-size="14" fill="#9a9ea5">1982</text>
    </g>

    <!-- CD-R 1996 -->
    <g transform="translate(620,250)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#f7941d" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#f7941d" stroke-width="2"/>
      <text x="0" y="47" text-anchor="middle" font-size="14" fill="#9a9ea5">1996</text>
    </g>

    <!-- USB 2010 -->
    <g transform="translate(840,250)">
      <rect x="-8" y="-26" width="16" height="14" fill="#f7941d"/>
      <rect x="-18" y="-12" width="36" height="30" rx="3" fill="none" stroke="#f7941d" stroke-width="2.5"/>
      <text x="0" y="47" text-anchor="middle" font-size="14" fill="#9a9ea5">2010</text>
    </g>

    <!-- microSD 2025 -->
    <g transform="translate(1020,250)">
      <path d="M -16 -22 L 10 -22 L 18 -14 L 18 22 L -16 22 Z" fill="none" stroke="#f7941d" stroke-width="2.5"/>
      <text x="0" y="47" text-anchor="middle" font-size="14" fill="#9a9ea5">2025</text>
    </g>
  </svg>
</div>
